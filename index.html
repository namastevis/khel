<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Khel</title>
<meta name="description" content="The games your grandparents played — Pachisi&rsquo;s Ludo, Moksha Patam and more — made to be played together round one tablet. No ads, no tracking, no sign-in, no internet needed." />
<meta name="theme-color" content="#EFE4CC" />

<!-- how the link looks when it lands in a chat -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Khel — the games your grandparents played" />
<meta property="og:description" content="Ludo from Pachisi, Moksha Patam (the original Snakes &amp; Ladders) and more — made to be played together round one tablet. No ads, no tracking, no sign-in, and no internet needed." />
<meta property="og:url" content="https://namastevis.in/khel/" />
<meta property="og:image" content="https://namastevis.in/khel/icons/share-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Khel" />
<link rel="preload" href="fonts/yatra-one-devanagari-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>

<!-- ══════════════ THE SHELF ══════════════ -->
<section id="screen-shelf" class="screen is-active">
  <div class="shelf-wrap">
    <h1 class="logo">
      <span class="logo-dev" lang="hi">खेल</span>
      <span class="logo-en">Khel</span>
    </h1>
    <p class="tagline">The games your grandparents played</p>
    <div class="band" aria-hidden="true"></div>
    <p class="promise">Made to be played together. No ads, no sign-in, no internet needed.</p>

    <div id="install-bar" class="install-bar" hidden>
      <button id="btn-install" class="install-btn">
        <span class="install-icon">&#128241;</span>
        <span class="install-text">
          <b>Add to Home Screen</b>
          <small>Play offline, full screen, like a real app</small>
        </span>
      </button>
      <button id="btn-install-x" class="install-x" aria-label="Not now">&times;</button>
    </div>

    <div class="shelf" id="shelf"></div>

    <section class="family" aria-label="Family">
      <h2 class="family-title">Who lives here</h2>
      <div class="family-row" id="family-row"></div>
    </section>

    <p class="last-round" id="last-round" hidden></p>

    <p class="dedication" id="dedication">
      <span class="ded-lead">Made for Chueen</span>
      <span class="ded-rest">because every other game on her tablet was stuffed with ads.</span>
    </p>

    <div class="shelf-foot">
      <button id="btn-sound" class="icon-btn" aria-label="Sound on or off">&#128266;</button>
      <!-- The quiet way back. The banner above can be dismissed; this can't,
           so saying "not now" never locks anyone out of saying yes later. -->
      <button id="btn-install-mini" class="install-mini" hidden>&#65291; Add to Home Screen</button>
    </div>

    <!-- Which copy this device is actually running. The only way to answer
         "is my tablet up to date?" without a laptop and a cable. -->
    <p class="version" id="version" hidden></p>
  </div>
</section>

<!-- ══════════════ where a game comes from ══════════════ -->
<div id="story" class="overlay story-overlay">
  <div class="help-card story-card" role="dialog" aria-labelledby="story-title">
    <div class="band" aria-hidden="true"></div>
    <p class="story-kicker" id="story-kicker"></p>
    <h2 id="story-title">Story</h2>
    <div class="story-body" id="story-body"></div>
    <p class="story-names" id="story-names"></p>
    <p class="story-here" id="story-here"></p>
    <p class="story-ask" id="story-ask"></p>
    <button class="big-btn" id="story-play">Play</button>
    <button class="ghost-btn" id="story-close">Close</button>
  </div>
</div>

<!-- ══════════════ WHERE A GAME LIVES ══════════════ -->
<!-- The shared message at the top of the screen. Every game writes here. -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="screen-game" class="screen">
  <div id="game-host"></div>
  <div id="game-loading" class="loading" hidden>Loading&hellip;</div>
</section>

<!-- ══════════════ adding or editing someone ══════════════ -->
<div id="member-sheet" class="sheet">
  <div class="sheet-card">
    <h2 class="sheet-title" id="member-title">Edit</h2>

    <input id="member-name" class="sheet-input" maxlength="14" spellcheck="false"
           autocapitalize="words" autocomplete="off" enterkeyhint="done" placeholder="Name" />

    <div class="face-row" id="member-faces"></div>
    <div class="tint-row" id="member-tints"></div>

    <p class="sheet-note" id="member-note"></p>

    <button id="member-done" class="big-btn">Done</button>
    <button id="member-remove" class="ghost-btn danger">Remove from the family</button>
  </div>
</div>

<!-- ══════════════ iOS: point at Safari's share button ══════════════ -->
<div id="ios-overlay" class="coach" hidden>
  <div class="coach-bubble">
    <p class="coach-line">
      Tap
      <svg class="share-glyph" viewBox="0 0 24 24" aria-label="the Share button">
        <path d="M7 10.5h-.5A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5H17"
              fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M12 14.5V3.5M8.4 7.1 12 3.5l3.6 3.6"
              fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      then <b>Add to Home&nbsp;Screen</b>
    </p>
    <p class="coach-sub">Tap anywhere to close</p>
  </div>
  <svg class="coach-arrow" viewBox="0 0 40 60" aria-hidden="true">
    <path d="M20 4v46M8 38l12 12 12-12" fill="none" stroke="currentColor"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<script type="module" src="js/shell.js"></script>
</body>
</html>
