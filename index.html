<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Khel</title>
<meta name="description" content="A small shelf of ad-free games for children. Works offline." />
<meta name="theme-color" content="#FFF6E5" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Khel" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- ══════════════ THE SHELF ══════════════ -->
<section id="screen-shelf" class="screen is-active">
  <div class="shelf-wrap">
    <h1 class="logo">
      <span class="logo-l" style="--c:var(--red)">K</span><span class="logo-l" style="--c:var(--green)">h</span><span class="logo-l" style="--c:var(--yellow)">e</span><span class="logo-l" style="--c:var(--blue)">l</span>
    </h1>
    <p class="tagline">No ads. No internet needed. Just play.</p>

    <div id="install-bar" class="install-bar" hidden>
      <button id="btn-install" class="install-btn">
        <span class="install-icon">&#128241;</span>
        <span class="install-text">
          <b>Add to Home Screen</b>
          <small>Play offline, full screen, like a real app</small>
        </span>
      </button>
      <button id="btn-install-x" class="install-x" aria-label="Not now">&times;</button>
    </div>

    <div class="shelf" id="shelf"></div>

    <div class="shelf-foot">
      <button id="btn-sound" class="icon-btn" aria-label="Sound on or off">&#128266;</button>
    </div>
  </div>
</section>

<!-- ══════════════ WHERE A GAME LIVES ══════════════ -->
<section id="screen-game" class="screen">
  <div id="game-host"></div>
  <div id="game-loading" class="loading" hidden>Loading&hellip;</div>
</section>

<!-- ══════════════ iOS: point at Safari's share button ══════════════ -->
<div id="ios-overlay" class="coach" hidden>
  <div class="coach-bubble">
    <p class="coach-line">
      Tap
      <svg class="share-glyph" viewBox="0 0 24 24" aria-label="the Share button">
        <path d="M7 10.5h-.5A1.5 1.5 0 0 0 5 12v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5H17"
              fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M12 14.5V3.5M8.4 7.1 12 3.5l3.6 3.6"
              fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      then <b>Add to Home&nbsp;Screen</b>
    </p>
    <p class="coach-sub">Tap anywhere to close</p>
  </div>
  <svg class="coach-arrow" viewBox="0 0 40 60" aria-hidden="true">
    <path d="M20 4v46M8 38l12 12 12-12" fill="none" stroke="currentColor"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<script type="module" src="js/shell.js"></script>
</body>
</html>
